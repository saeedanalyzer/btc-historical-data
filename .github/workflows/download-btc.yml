name: Download BTCUSDT historical data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download Binance 4h candles
        run: |
          python - <<'PY'
          import csv
          import json
          import time
          import urllib.request
          from datetime import datetime, timezone

          symbol = "BTCUSDT"
          interval = "4h"
          start = int(datetime(2022, 1, 1, tzinfo=timezone.utc).timestamp() * 1000)
          now = int(time.time() * 1000)
          rows = []

          while start < now:
              url = (
                  "https://data-api.binance.vision/api/v3/klines"
                  f"?symbol={symbol}&interval={interval}"
                  f"&startTime={start}&limit=1000"
              )
              req = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())

              if not data:
                  break

              for candle in data:
                  if int(candle[6]) <= now:
                      rows.append(candle)

              last_open = int(data[-1][0])
              if len(data) < 1000 or last_open <= start:
                  break

              start = last_open + 1
              time.sleep(0.2)

          rows.sort(key=lambda x: int(x[0]))

          with open("BTCUSDT-4h-2022-present.csv", "w", newline="") as f:
              writer = csv.writer(f)
              writer.writerow([
                  "open_time", "open", "high", "low",
                  "close", "volume", "close_time"
              ])
              for candle in rows:
                  writer.writerow(candle[:7])

          print("Candles downloaded:", len(rows))
          if not rows:
              raise RuntimeError("No candles downloaded")
          PY

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: BTCUSDT-4h-historical-data
          path: BTCUSDT-4h-2022-present.csv
          retention-days: 30
